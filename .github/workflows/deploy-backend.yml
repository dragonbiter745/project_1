name: Deploy backend

# Manual on purpose: functions move money and rules guard data, so a person picks the
# moment and the backend-production environment can require a reviewer's approval.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - functions
          - firestore-rules
          - all
        default: functions

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backend-production
    env:
      TARGET: ${{ inputs.target }}
      FIREBASE_PROJECT_ID: reva-nest-foodcourt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build functions
        run: pnpm turbo run build --filter=functions

      # Functions read Cashfree config from process.env, loaded from functions/.env at deploy.
      # The values live only in this environment's secrets and the file is deleted afterwards.
      - name: Write functions/.env from environment secrets
        if: env.TARGET != 'firestore-rules'
        env:
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_ENV: ${{ secrets.CASHFREE_ENV }}
          CASHFREE_API_VERSION: ${{ secrets.CASHFREE_API_VERSION }}
        run: |
          set -euo pipefail
          for name in CASHFREE_APP_ID CASHFREE_SECRET_KEY CASHFREE_ENV; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the backend-production environment"
              exit 1
            fi
          done
          umask 077
          {
            echo "CASHFREE_APP_ID=$CASHFREE_APP_ID"
            echo "CASHFREE_SECRET_KEY=$CASHFREE_SECRET_KEY"
            echo "CASHFREE_ENV=$CASHFREE_ENV"
            echo "CASHFREE_API_VERSION=${CASHFREE_API_VERSION:-2023-08-01}"
          } > functions/.env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: |
          set -euo pipefail
          case "$TARGET" in
            functions) ONLY="functions" ;;
            firestore-rules) ONLY="firestore:rules,firestore:indexes" ;;
            all) ONLY="functions,firestore:rules,firestore:indexes" ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac
          npx --yes firebase-tools@13 deploy --only "$ONLY" --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Remove functions/.env
        if: always()
        run: rm -f functions/.env
