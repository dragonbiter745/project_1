name: Frontend · Finance console

on:
  pull_request:
    paths:
      - apps/admin/**
      - packages/shared/**
      - packages/ui/**
      - packages/firebase-client/**
      - packages/finance-ui/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - tsconfig.base.json
      - pnpm-workspace.yaml
      - .npmrc
      - firebase.json
      - .github/actions/setup/**
      - .github/workflows/_frontend.yml
      - .github/workflows/frontend-admin.yml
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - packages/shared/**
      - packages/ui/**
      - packages/firebase-client/**
      - packages/finance-ui/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - tsconfig.base.json
      - pnpm-workspace.yaml
      - .npmrc
      - firebase.json
      - .github/actions/setup/**
      - .github/workflows/_frontend.yml
      - .github/workflows/frontend-admin.yml
  workflow_dispatch:

concurrency:
  group: frontend-admin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  admin:
    uses: ./.github/workflows/_frontend.yml
    with:
      app: admin
      live-url: https://reva-nest-finance.web.app
    secrets: inherit
