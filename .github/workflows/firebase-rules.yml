name: Firebase · Rules & indexes

on:
  pull_request:
    paths:
      - firebase/**
      - firebase.json
      - .firebaserc
      - scripts/ci/validate-rules.mjs
      - .github/workflows/firebase-rules.yml
  push:
    branches: [main]
    paths:
      - firebase/**
      - firebase.json
      - .firebaserc
      - scripts/ci/validate-rules.mjs
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

concurrency:
  group: firebase-rules-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: reva-nest-foodcourt

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Indexes file is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firebase/firestore.indexes.json','utf8'))"

      # Booting the emulators alone does not validate rules; the script loads them into the
      # emulators, which compile them. demo-* projects need no cloud credentials.
      - name: Compile Firestore and Storage rules
        run: npx --yes firebase-tools@13 emulators:exec --only firestore,storage --project demo-foodcourt "node scripts/ci/validate-rules.mjs"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rules guard every read and write: the firebase-production environment should require a reviewer.
    environment: firebase-production
    concurrency:
      group: deploy-firebase-rules
      cancel-in-progress: false
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Firebase credentials missing
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, so rules were not deployed. See docs/runbook.md."

      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE_SA == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          node-version: 22

      - uses: google-github-actions/auth@v2
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules and indexes
        if: env.HAS_FIREBASE_SA == 'true'
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
