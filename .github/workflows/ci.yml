name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: reva-nest-foodcourt

jobs:
  verify:
    name: Typecheck, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional repo variables; the apps fall back to the checked-in public web config.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: pnpm turbo run lint

      - name: Build apps and functions
        run: pnpm turbo run build

      - name: Customer bundle budget (PRD §5, 150 KB gz)
        run: node scripts/ci/check-bundle-size.mjs apps/customer/dist

      # Deploy jobs ship exactly what was verified here instead of rebuilding.
      - name: Upload hosting builds
        uses: actions/upload-artifact@v4
        with:
          name: hosting-dist
          path: |
            apps/customer/dist
            apps/vendor/dist
            apps/master/dist
          retention-days: 7
          if-no-files-found: error

  preview:
    name: Preview deploy (PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: apps

      - name: Firebase credentials missing
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set, so preview deploys are skipped. See docs/runbook.md#cicd."

      - name: Customer preview
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: customer
          expires: 7d

      - name: Vendor preview
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: vendor
          expires: 7d

      - name: Master preview
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: master
          expires: 7d

  production:
    name: Deploy hosting (live)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: hosting-production
      url: https://reva-nest-foodcourt.web.app
    concurrency:
      group: deploy-hosting-live
      cancel-in-progress: false
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: apps

      - name: Firebase credentials missing
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, so main was not deployed. See docs/runbook.md#cicd."

      - name: Customer live
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: customer
          channelId: live

      - name: Vendor live
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: vendor
          channelId: live

      - name: Master live
        if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: master
          channelId: live
