name: Backend · Cloud Functions

on:
  pull_request:
    paths:
      - functions/**
      - pnpm-lock.yaml
      - turbo.json
      - tsconfig.base.json
      - pnpm-workspace.yaml
      - .npmrc
      - firebase.json
      - .github/actions/setup/**
      - .github/workflows/backend-functions.yml
  push:
    branches: [main]
    paths:
      - functions/**
      - pnpm-lock.yaml
      - turbo.json
      - tsconfig.base.json
      - pnpm-workspace.yaml
      - .npmrc
      - firebase.json
      - .github/actions/setup/**
      - .github/workflows/backend-functions.yml
  workflow_dispatch:

concurrency:
  group: backend-functions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: reva-nest-foodcourt

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Pack shared into functions
        run: pnpm run pack:shared

      - name: Typecheck and build functions
        run: pnpm turbo run build --filter=functions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Backend and rules tests (Firestore emulator)
        working-directory: functions
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-foodcourt "npx vitest run"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Functions move money: the backend-production environment should require a reviewer.
    environment: backend-production
    concurrency:
      group: deploy-functions
      cancel-in-progress: false
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Firebase credentials missing
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set, so functions were not deployed. See docs/runbook.md."

      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE_SA == 'true'

      - uses: ./.github/actions/setup
        if: env.HAS_FIREBASE_SA == 'true'

      - name: Build functions
        if: env.HAS_FIREBASE_SA == 'true'
        run: pnpm turbo run build --filter=functions

      # Cashfree keys live in Secret Manager (defineSecret); deploy reads them there. Nothing is
      # written to disk. CASHFREE_ENV (SANDBOX / PRODUCTION) comes from functions/.env.<project>.
      - uses: google-github-actions/auth@v2
        if: env.HAS_FIREBASE_SA == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions
        if: env.HAS_FIREBASE_SA == 'true'
        run: npx --yes firebase-tools@13 deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

