<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Order · Qrave</title>
    <meta name="description" content="Scan, order from every shop in one cart, and pay once. Scan it. Crave it." />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qrave" />
    <link rel="preconnect" href="https://sdk.cashfree.com" crossorigin />
    <style>
      /* Static first-paint shell: visible before JS arrives, replaced on mount. */
      html,body{margin:0;background:#faf9f6}
      .boot{max-width:28rem;margin:0 auto;padding:16px;font-family:system-ui,-apple-system,sans-serif}
      .boot i{display:block;border-radius:12px;background:#f1eee8}
      .boot .h{height:40px;width:55%;margin-bottom:16px}
      .boot .s{height:44px;margin-bottom:12px}
      .boot .c{height:72px;border-radius:16px;background:#ffffff;margin-bottom:8px}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><i class="h"></i><i class="s"></i><i class="s"></i><i class="c"></i><i class="c"></i><i class="c"></i><i class="c"></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
